[package]
name = "trka"
version = "0.1.0"
edition = "2021"

[dependencies]
bevy = { version = "0.19", default-features = false, features = [
    "bevy_asset",
    "bevy_core_pipeline",
    "bevy_pbr",
    "bevy_render",
    "bevy_scene",
    "bevy_state",
    "bevy_ui",
    "bevy_window",
    "bevy_winit",
    "default_font",
    "png",
    "tonemapping_luts",
    "x11",
    "zstd_rust",
] }
avian3d = "0.7"
earcutr = "0.5"
geojson = "0.24"
maolan-engine = "0.2"
quick-xml = "0.37"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
ureq = { version = "2", features = ["charset"] }
tracing = "0.1"
tracing-subscriber = "0.3"
